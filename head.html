<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job request intake and tracker demo | Casim Bahadar</title>
<meta name="description" content="A service request form for a fictional plumbing company that sets priority by visible rules, then produces a job checklist, a customer message, a calendar file and a spreadsheet row, with a status board. Runs in your browser.">
<meta name="theme-color" content="#F7F5FB">
__CSP__
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%275%27 y=%271%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%23A993E4%27/%3E%3Crect x=%271%27 y=%275%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%235A3DB8%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap">
<style>
__BASECSS__
/* Demo 3 additions */
.scroll { position: relative; }
.company { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s1) var(--s3); margin: 0 0 var(--s4); }
.company b { font-size: 1.125rem; font-weight: 800; }
form { max-width: 40rem; }
.field { margin: 0 0 var(--s6); }
.field > label, .field > .label, fieldset.field > legend { display: block; font-weight: 700; margin-bottom: var(--s1); }
.opt { font-weight: 500; color: var(--slate); }
.help { display: block; font-size: 0.9375rem; color: var(--slate); margin-bottom: var(--s2); }
input[type="text"], input[type="tel"], input[type="email"], input[type="date"], textarea.box {
  width: 100%; font: inherit; font-size: 1rem; min-height: 3rem; padding: var(--s2) var(--s3);
  border: 1.5px solid var(--slate); border-radius: var(--r-md); background: #fff; color: var(--ink);
}
textarea.box { min-height: 7rem; line-height: 1.5; }
[aria-invalid="true"] { border-color: var(--error) !important; border-width: 2px !important; }
.err { display: block; color: var(--error); font-weight: 650; font-size: 0.9375rem; margin-top: var(--s1); }
.err:empty { display: none; }
.pair-fields { display: grid; gap: 0 var(--s4); }
@media (min-width: 40rem) { .pair-fields { grid-template-columns: 1fr 1fr; } }
.choice { display: flex; align-items: center; gap: var(--s3); min-height: 2.75rem; }
.field > label.choice { display: flex; font-weight: 500; margin: 0; }
.choices { display: grid; gap: 0 var(--s4); }
@media (min-width: 40rem) { .choices.two { grid-template-columns: 1fr 1fr; } }
.error-summary { margin: 0 0 var(--s6); padding: var(--s4); border: 2px solid var(--error); border-radius: var(--r-md); background: var(--error-bg); }
.error-summary h3 { margin: 0 0 var(--s2); color: var(--error); font-size: 1.05rem; }
.error-summary ul { margin: 0; padding-left: var(--s6); }
.error-summary a { color: var(--error); font-weight: 650; }
.danger { margin: var(--s4) 0 0; padding: var(--s4); border: 2px solid var(--error); border-radius: var(--r-md); background: var(--error-bg); }
.danger h3 { margin: 0 0 var(--s2); color: var(--error); font-size: 1.1rem; }
.danger p { margin: 0 0 var(--s2); }
.danger p:last-child { margin: 0; }
.rules { margin: var(--s8) 0 0; padding: var(--s4); background: var(--mist); border-radius: var(--r-md); max-width: 40rem; }
.rules h3 { margin: 0 0 var(--s2); font-size: 1.05rem; }
.rules ol { margin: 0; padding-left: var(--s6); }
.rules li { margin-bottom: var(--s1); }
.output { margin-top: var(--s8); padding: var(--s4); border: 2px solid var(--violet); border-radius: var(--r-md); background: #fff; }
.output > h3 { margin: 0 0 var(--s1); }
.out-part { padding-top: var(--s4); margin-top: var(--s4); border-top: 1px solid var(--line); }
.out-part h4 { margin-bottom: var(--s2); }
.prio { display: inline-block; font-weight: 800; padding: 0 var(--s2); border-radius: var(--r-md); font-size: 0.9375rem; }
.prio-Urgent { background: var(--error); color: #fff; }
.prio-Soon { background: #8A6A12; color: #fff; }
.prio-Routine { background: var(--lav); color: var(--ink); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { margin: 0; }
.msg { width: 100%; min-height: 9rem; font: inherit; font-size: 1rem; line-height: 1.5; padding: var(--s3); border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--paper); color: var(--ink); resize: vertical; }
.toolbar { display: flex; flex-direction: column; gap: var(--s3); margin: var(--s4) 0; }
.toolbar > .btn { width: 100%; }
@media (min-width: 40rem) { .toolbar { flex-direction: row; flex-wrap: wrap; } .toolbar > .btn { flex: 1 1 0; width: auto; max-width: 16rem; } }
.board-filter { display: grid; gap: var(--s1); max-width: 24rem; margin: 0 0 var(--s4); }
.board-filter label { font-weight: 650; }
.board { display: grid; gap: var(--s6); }
.col h3 { margin: 0 0 var(--s3); font-size: 1.1rem; display: flex; align-items: baseline; gap: var(--s2); }
.col h3 .count { font-weight: 650; color: var(--slate); font-size: 0.9375rem; }
.cards { display: grid; gap: var(--s3); list-style: none; margin: 0; padding: 0; }
.card { padding: var(--s4); border: 1.5px solid var(--line); border-radius: var(--r-md); background: #fff; min-width: 0; }
.card h4 { margin: var(--s2) 0 var(--s1); font-size: 1.05rem; overflow-wrap: anywhere; }
.card p { margin: 0; font-size: 0.9375rem; overflow-wrap: anywhere; }
.card .meta { color: var(--slate); }
.card .actions { margin-bottom: 0; }
.card .details { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
.card .details h5 { margin: var(--s3) 0 var(--s1); font-size: 0.9375rem; }
.empty-col { color: var(--slate); font-size: 0.9375rem; margin: 0; }
@media (min-width: 60rem) {
  .board { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); }
  .board-filter { display: none; }
  .col[hidden] { display: block !important; }
  .card .actions { flex-direction: column; }
  .card .actions > .btn { max-width: none; width: 100%; }
}
.note-inline { font-size: 0.9375rem; color: var(--slate); }
</style>
</head>
